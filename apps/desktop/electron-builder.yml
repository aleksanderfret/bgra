appId: local.bga.desktop
productName: BGA
copyright: Copyright © BGA contributors
directories:
  output: release
  buildResources: packaging
files:
  - dist/**/*
  - package.json
  - "!**/*.map"
extraResources:
  # Monorepo standalone lays out apps/web/server.js under the standalone root.
  # Copying to repo/ (not repo/apps/web) keeps server.js at repo/apps/web/server.js
  # and the traced node_modules next to apps/.
  #
  # electron-builder's FileMatcher always skips a *root* folder named node_modules
  # (see app-builder-lib util/filter.js). Copy that tree as its own FileSet so Next
  # can resolve `require('next')` from standalone server.js.
  - from: ../../apps/web/.next/standalone
    to: repo
    filter:
      - "**/*"
  - from: ../../apps/web/.next/standalone/node_modules
    to: repo/node_modules
    filter:
      - "**/*"
  - from: ../../apps/web/.next/static
    to: repo/apps/web/.next/static
  - from: ../../services/rag-engine
    to: repo/services/rag-engine
    filter:
      - "rag_engine/**/*"
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - "!.env"
      - "!.env.*"
      - "!*.pdf"
      - "!*.pem"
      - "!models/**"
      - "!*.gguf"
      - "!tests/**"
      - "!storage/**"
      - "!.venv/**"
      - "!**/__pycache__/**"
      - "!.mypy_cache/**"
      - "!.ruff_cache/**"
      - "!.pytest_cache/**"
  - from: ../../packages/api-contract
    to: repo/packages/api-contract
    filter:
      - "**/*"
      - "!node_modules/**"
  - from: ../../apps/web/src/i18n/locales
    to: i18n
    filter:
      - "**/common.json"
  - from: packaging/bin
    to: bin
    filter:
      - "**/*"
mac:
  category: public.app-category.utilities
  target:
    - dmg
    - zip
  hardenedRuntime: false
  gatekeeperAssess: false
  entitlements: packaging/entitlements.mac.plist
  entitlementsInherit: packaging/entitlements.mac.plist
  extendInfo:
    NSMicrophoneUsageDescription: BGA needs the microphone for push-to-talk questions about board game rules.
win:
  target:
    - nsis
  artifactName: ${productName}-Setup-${version}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
electronVersion: 35.7.5
